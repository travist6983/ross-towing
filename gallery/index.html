<meta name="description" content="Photos of Ross Towing towing jobs and freight loads. Southfield, Michigan. Call 248-356-6011, staffed 24 hours a day, 365 days a year.">
<meta name="theme-color" content="#0E0F11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E0F11'/%3E%3Cpath d='M9 7h8.5c3.6 0 6 2 6 5.2 0 2.4-1.4 4.1-3.6 4.8L24 25h-5l-3.4-7.4H13.5V25H9z M13.5 10.8v3.4h3.6c1.2 0 1.9-.6 1.9-1.7s-.7-1.7-1.9-1.7z' fill='%23C70606'/%3E%3C/svg%3E">

<link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>

</style>
<script type="module" src="/src/gallery.js"></script>
</head>
<body class="gallery-page">
<!-- @include icons.svg -->
<!-- @include header.html -->
<main id="main">
  <section class="page-sec tone-night g-head" aria-labelledby="g-h">
    <div class="page-wrap">
      <p class="eyebrow">Gallery</p>
      <h1 id="g-h">Towing and freight</h1>
      <p class="lede">Recovery work, tows and freight loads from the Ross Towing crew. Need a tow? Call <a href="tel:+12483566011" data-track="preview_call" data-track-detail="gallery"><span data-phone>248-356-6011</span></a>.</p>
      <div class="g-tabs" role="group" aria-label="Show photos">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="towing" aria-pressed="false">Towing</button>
        <button type="button" data-filter="freight" aria-pressed="false">Freight</button>
      </div>
    </div>
  </section>
  <section class="page-sec tone-night g-body" aria-label="Photos">
    <div class="page-wrap">
      <ul class="g-grid" id="g-grid">
<!-- @section gallery -->
      </ul>
      <p class="g-empty" hidden>No photos in this category yet.</p>
      <div class="inline-call">
        <p>Need a tow or a freight quote?</p>
        <a class="btn btn-call" href="tel:+12483566011" data-track="preview_call" data-track-detail="gallery bottom"><svg class="ico" aria-hidden="true"><use href="#i-phone"/></svg>Call <span class="num" data-phone>248-356-6011</span></a>
        <!-- @section online freight-inline -->
      </div>
    </div>
  </section>
</main>
<dialog class="lb" id="lb" aria-label="Photo viewer">
  <figure class="lb-fig">
    <picture class="lb-pic"><source type="image/avif"><img alt=""></picture>
    <figcaption class="lb-cap"><span class="lb-text"></span> <span class="lb-count"></span></figcaption>
  </figure>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous photo"><svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></button>
  <button class="lb-btn lb-next" type="button" aria-label="Next photo"><svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></button>
  <button class="lb-btn lb-close" type="button" aria-label="Close photo viewer"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
</dialog>
<!-- @include footer.html -->

</body>
</html>
